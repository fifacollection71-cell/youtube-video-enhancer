<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#24242e"/>
      <stop offset="70%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>

    <!-- Outer Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ff8c00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>

    <!-- YouTube Screen / Badge Gradient -->
    <linearGradient id="ytBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="50%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Badge Highlight / Gloss -->
    <linearGradient id="badgeGloss" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f5"/>
    </linearGradient>

    <!-- Star Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>

    <!-- Sun Ray Gradient -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffab00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="playShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#b31217" flood-opacity="0.5"/>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Squircle (App Store Standard rounded rectangle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.12"/>
  <rect x="18" y="18" width="476" height="476" rx="106" ry="106" fill="none" stroke="#ff5722" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Ambient Light Burst Behind YouTube Plate -->
  <circle cx="256" cy="256" r="190" fill="url(#ambientGlow)"/>

  <!-- Brightness Enhancement Rays radiating behind play button -->
  <g opacity="0.35" transform="translate(256, 256)">
    <line x1="0" y1="-175" x2="0" y2="-195" stroke="#ffb300" stroke-width="6" stroke-linecap="round"/>
    <line x1="124" y1="-124" x2="138" y2="-138" stroke="#ffb300" stroke-width="6" stroke-linecap="round"/>
    <line x1="175" y1="0" x2="195" y2="0" stroke="#ffb300" stroke-width="6" stroke-linecap="round"/>
    <line x1="124" y1="124" x2="138" y2="138" stroke="#ffb300" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="175" x2="0" y2="195" stroke="#ffb300" stroke-width="6" stroke-linecap="round"/>
    <line x1="-124" y1="124" x2="-138" y2="138" stroke="#ffb300" stroke-width="6" stroke-linecap="round"/>
    <line x1="-175" y1="0" x2="-195" y2="0" stroke="#ffb300" stroke-width="6" stroke-linecap="round"/>
    <line x1="-124" y1="-124" x2="-138" y2="-138" stroke="#ffb300" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Main YouTube Badge with Drop Shadow and Vibrance Gradient -->
  <g filter="url(#shadowFilter)">
    <rect x="96" y="146" width="320" height="220" rx="64" ry="64" fill="url(#ytBadgeGrad)"/>
    <!-- Top inner highlight for glass/specular sheen -->
    <path d="M160 148 C120 148, 98 170, 98 210 L98 230 C130 200, 210 185, 320 185 C370 185, 400 195, 414 205 L414 210 C414 170, 392 148, 352 148 Z" fill="url(#badgeGloss)"/>
    <!-- Border glow -->
    <rect x="96" y="146" width="320" height="220" rx="64" ry="64" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
  </g>

  <!-- YouTube Play Triangle (White, slightly raised) -->
  <path d="M226 208 C226 203.5, 230.8 200.7, 234.7 203.0 L314.7 249.0 C318.5 251.2, 318.5 256.8, 314.7 259.0 L234.7 305.0 C230.8 307.3, 226 304.5, 226 300.0 Z"
        fill="url(#playGrad)" filter="url(#playShadow)"/>

  <!-- Vibrance / Color Magic Star 1 (Prominent Top-Right) -->
  <g transform="translate(385, 125)" filter="url(#sparkleGlow)">
    <!-- 4-point star -->
    <path d="M0 -34 C1 -9, 9 -1, 34 0 C9 1, 1 9, 0 34 C-1 9, -9 1, -34 0 C-9 -1, -1 -9, 0 -34 Z" fill="url(#sparkleGrad)"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Vibrance / Color Magic Star 2 (Subtle Bottom-Left) -->
  <g transform="translate(125, 375)" filter="url(#sparkleGlow)" opacity="0.85">
    <path d="M0 -20 C0.6 -5, 5 -0.6, 20 0 C5 0.6, 0.6 5, 0 20 C-0.6 5, -5 0.6, -20 0 C-5 -0.6, -0.6 -5, 0 -20 Z" fill="url(#sparkleGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Small Brightness Accent Dot -->
  <circle cx="340" cy="95" r="4" fill="#ffe082" opacity="0.9" filter="url(#sparkleGlow)"/>
  <circle cx="430" cy="180" r="3" fill="#ffd54f" opacity="0.8"/>
  <circle cx="85" cy="330" r="3" fill="#ffb74d" opacity="0.7"/>
</svg>
